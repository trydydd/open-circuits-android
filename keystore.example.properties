# Copy this file to keystore.properties (which is gitignored) and fill in real values.
# Never commit keystore.properties or the keystore file itself.
# In CI, inject these via GitHub Actions secrets decoded to a temp file.
keystorePath=/path/to/release.keystore
keystorePassword=replace_with_keystore_password
keyAlias=replace_with_key_alias
keyPassword=replace_with_key_password
